<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechLearn</title>
<script>
  // Runs before CSS is applied so a saved "light" preference doesn't
  // flash the dark theme first. Dark is the default when nothing is saved.
  (function () {
    try {
      if (localStorage.getItem("pathlearn_theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-logo">🖥️</span>
      <span class="brand-name" id="course-title">TechLearn</span>
    </div>
    <div class="stats">
      <div class="stat stat-streak" title="Day streak">
        <span class="stat-icon">🔥</span><span id="streak-count">0</span>
      </div>
      <div class="stat stat-xp" title="Total XP">
        <span class="stat-icon">⭐</span><span id="xp-count">0</span>
      </div>
      <button class="icon-action-btn" id="reset-progress-btn" title="Reset all progress">⟲</button>
      <button class="icon-action-btn" id="theme-toggle-btn" title="Switch appearance">🌙</button>
    </div>
  </div>
  <div class="unit-pill" id="unit-pill">Objective 1</div>
</header>

<!-- ============ PAGE LAYOUT (path + side rail) ============ -->
<div class="page-layout">
  <main class="path-wrapper">
    <div class="path-container" id="path-container">
      <svg id="path-svg" class="path-svg"></svg>
      <!-- units + lesson nodes are injected here by js/app.js -->
    </div>
    <div class="path-end-cap" id="path-end-cap">
      <div class="end-cap-icon">🏁</div>
      <div class="end-cap-text">More lessons coming soon</div>
    </div>
  </main>

  <aside class="side-rail">
    <div class="rail-card">
      <div class="rail-card-title">Daily goal</div>
      <div class="goal-ring-wrap">
        <svg class="goal-ring" viewBox="0 0 100 100">
          <circle class="goal-ring-bg" cx="50" cy="50" r="42"></circle>
          <circle class="goal-ring-fill" id="goal-ring-fill" cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="goal-ring-label">
          <span id="goal-xp-today">0</span>
          <span class="goal-xp-total">/30 XP</span>
        </div>
      </div>
      <div class="goal-caption" id="goal-caption">Finish a lesson to get started today.</div>
    </div>

    <div class="rail-card">
      <div class="rail-card-title">This week</div>
      <div class="week-strip" id="week-strip"></div>
    </div>

    <div class="rail-card">
      <div class="rail-card-title">Course progress</div>
      <div class="course-progress-track"><div class="course-progress-fill" id="course-progress-fill"></div></div>
      <div class="course-progress-label" id="course-progress-label">0 / 0 lessons</div>
    </div>

    <div class="rail-card rail-card-tip">
      <div class="rail-card-title">Tip</div>
      <div class="tip-text" id="tip-text"></div>
    </div>
  </aside>
</div>


<!-- ============ LESSON OVERLAY ============ -->
<div class="lesson-overlay" id="lesson-overlay" hidden>
  <div class="lesson-topbar">
    <button class="icon-btn" id="lesson-close-btn" aria-label="Close lesson">✕</button>
    <div class="progress-track"><div class="progress-fill" id="lesson-progress-fill"></div></div>
    <div class="hearts" id="lesson-hearts"></div>
  </div>

  <div class="lesson-body" id="lesson-body">
    <!-- exercise content injected here -->
  </div>

  <div class="lesson-footer" id="lesson-footer">
    <div class="lesson-footer-inner">
      <div class="feedback-row" id="feedback-row" hidden>
        <div class="feedback-icon" id="feedback-icon">✓</div>
        <div class="feedback-text">
          <div class="feedback-title" id="feedback-title">Nice!</div>
          <div class="feedback-explain" id="feedback-explain"></div>
        </div>
      </div>
      <button class="btn btn-primary" id="lesson-action-btn" disabled>Check</button>
    </div>
  </div>
</div>

<!-- ============ LESSON COMPLETE ============ -->
<div class="complete-overlay" id="complete-overlay" hidden>
  <div class="complete-card">
    <div class="complete-icon">🎉</div>
    <h2>Lesson complete!</h2>
    <div class="complete-stats">
      <div class="complete-stat">
        <span class="complete-stat-value" id="complete-xp">+10</span>
        <span class="complete-stat-label">XP</span>
      </div>
      <div class="complete-stat">
        <span class="complete-stat-value" id="complete-accuracy">100%</span>
        <span class="complete-stat-label">Accuracy</span>
      </div>
    </div>
    <button class="btn btn-primary" id="complete-continue-btn">Continue</button>
  </div>
</div>

<!-- ============ OUT OF HEARTS ============ -->
<div class="hearts-overlay" id="hearts-overlay" hidden>
  <div class="complete-card">
    <div class="complete-icon">💔</div>
    <h2>Out of hearts!</h2>
    <p>Review your notes and try again later</p>
    <button class="btn btn-primary" id="hearts-retry-btn">Retry lesson</button>
    <button class="btn btn-secondary" id="hearts-exit-btn">Exit to path</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
